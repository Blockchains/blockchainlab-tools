name: live-tests
on:
  push: { branches: [main] }
  schedule: [{ cron: "40 6 * * *" }]
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Generated pages are up to date
        run: python3 gen_pages.py && git diff --exit-code -- '*.html' sitemap.xml
  e2e:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.63.0 && python -m playwright install chromium
      - name: Browser tests against the live Pages site
        run: python3 test/e2e.py https://blockchains.github.io/blockchainlab-tools
